name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkout:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: enable Windows line conversion
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: verify container inputs after Windows checkout
        run: python scripts/check_checkout.py

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: pytest against PostgreSQL 17
        run: make test

  analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install uv==0.13.0
      - run: uv run --python 3.12 --frozen python -m unittest discover -s tests -v
      - run: uv run --python 3.12 --frozen python -m src.build_all
      - name: verify reproducible artifacts
        run: git diff --exit-code -- artifacts ../docs/analytics/img

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [checkout, backend, analytics, web]
    steps:
      - uses: actions/checkout@v4
      - name: start stack
        run: docker compose up --build -d --wait
      - name: demo scenarios through nginx
        run: E2E_BASE_URL=http://localhost:8080/api python3 scripts/e2e_demo.py
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
