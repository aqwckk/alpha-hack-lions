name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: pytest against PostgreSQL 17
        run: make test

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: start stack
        run: docker compose up --build -d --wait
      - name: demo scenarios through nginx
        run: E2E_BASE_URL=http://localhost:8080/api python3 scripts/e2e_demo.py
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
