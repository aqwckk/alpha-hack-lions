server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/ -> api:8000 (shared fragment from deploy/nginx/api-proxy.conf)
    include /etc/nginx/snippets/api-proxy.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # fingerprinted bundles: cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA routes fall back to index.html, which is always revalidated
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
